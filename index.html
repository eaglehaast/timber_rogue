<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18231f">
  <title>Timber Rogue</title>
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <main class="menu">
    <section id="home" aria-labelledby="title">
      <h1 id="title" lang="en">Timber<br>Rogue</h1>
      <nav aria-label="Главное меню">
        <a class="primary" href="game.html">Игра <span aria-hidden="true">→</span></a>
        <a href="game.html?grass=none">Игра без травы <span aria-hidden="true">→</span></a>
        <a href="#stands">Стенды <span aria-hidden="true">→</span></a>
      </nav>
    </section>
    <section id="stands" aria-labelledby="stands-title" hidden>
      <a class="back" href="#home">← Главное меню</a>
      <h2 id="stands-title" tabindex="-1">Стенды</h2>
      <nav id="stand-links" aria-label="Стенды">
        <a href="game.html?stand=fly">Летающая камера <span aria-hidden="true">→</span></a>
        <a href="game.html?stand=hud">Редактор HUD <span aria-hidden="true">→</span></a>
        <a href="game.html?stand=fall">Падение клёна <span aria-hidden="true">→</span></a>
        <a href="game.html?stand=wood">Костёр и поленница <span aria-hidden="true">→</span></a>
      </nav>
      <p id="desktop-note" hidden>Стенды открываются на компьютере.<br>На телефоне можно играть.</p>
    </section>
  </main>
  <script type="module">
    import { PHONE } from './src/device.js';
    const home = document.querySelector('#home'), stands = document.querySelector('#stands');
    document.querySelector('#stand-links').hidden = PHONE;
    document.querySelector('#desktop-note').hidden = !PHONE;
    const seed = new URLSearchParams(location.search).get('seed');
    if (seed) for (const link of document.querySelectorAll('a[href^="game.html"]')) {
      const url = new URL(link.href);
      url.searchParams.set('seed', seed);
      link.href = url;
    }
    function show() {
      const inStands = location.hash === '#stands';
      home.hidden = inStands;
      stands.hidden = !inStands;
      document.title = inStands ? 'Стенды · Timber Rogue' : 'Timber Rogue';
      if (inStands) document.querySelector('#stands-title').focus();
    }
    addEventListener('hashchange', show);
    show();
  </script>
</body>
</html>
